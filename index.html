
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mon Dashboard</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f5f5;
      color: #222;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 16px;
      margin: 16px 0;
    }
    button, input {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ddd;
    }
    button { cursor: pointer; background: white; }
    li { margin: 14px 0; }
    .done { text-decoration: line-through; color: #777; }
  </style>
</head>
<body>
  <h1>Mon Dashboard</h1>
  <p>Mon premier projet créé avec ChatGPT</p>

  <div class="card">
    <h2>Mes tâches</h2>
    <p id="count">0 tâche terminée</p>
    <input id="task" placeholder="Nouvelle tâche">
    <button id="add">Ajouter</button>
    <ul id="list"></ul>
  </div>

  <script>
    let tasks = JSON.parse(
      localStorage.getItem("tasks") || "[]"
    );

    const list = document.getElementById("list");
    const count = document.getElementById("count");

    function render() {
      list.innerHTML = "";

      tasks.forEach((task, i) => {
        const li = document.createElement("li");
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = task.done;

        cb.onchange = () => {
          tasks[i].done = cb.checked;
          save();
        };

        const span = document.createElement("span");
        span.textContent = " " + task.name;
        if (task.done) span.className = "done";

        const del = document.createElement("button");
        del.textContent = " Supprimer ";
        del.onclick = () => {
          tasks.splice(i, 1);
          save();
        };

        li.append(cb, span, document.createTextNode(" "));
        li.append(del);
        list.append(li);
      });

      const n = tasks.filter(t => t.done).length;
      count.textContent =
        `${n} tâche(s) terminée(s) sur ${tasks.length}`;
    }

    function save() {
      localStorage.setItem("tasks", JSON.stringify(tasks));
      render();
    }

    document.getElementById("add").onclick = () => {
      const input = document.getElementById("task");
      const name = input.value.trim();
      if (!name) return;

      tasks.push({ name, done: false });
      input.value = "";
      save();
    };

    render();
  </script>
</body>
</html>
