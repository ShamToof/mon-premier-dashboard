
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Dashboard</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f5f5;
      color: #222;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 16px;
      margin: 16px 0;
    }

    button, input {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ddd;
      font: inherit;
    }

    button {
      cursor: pointer;
      background: white;
      color: #222;
      min-width: 90px;
    }

    li { margin: 14px 0; }

    .done span {
      text-decoration: line-through;
      color: #777;
    }

    #tasks {
      padding-left: 24px;
    }
  </style>
</head>

<body>
  <h1>Mon Dashboard</h1>
  <p>Mon premier projet créé avec ChatGPT</p>

  <div class="card">
    <h2>Mes tâches</h2>
    <p id="counter">0 tâche(s) terminée(s) sur 0</p>

    <form id="taskForm">
      <input id="taskInput"
        type="text"
        placeholder="Nouvelle tâche"
        required>
      <button type="submit">Ajouter</button>
    </form>

    <ul id="tasks"></ul>
  </div>

  <script>
    const STORAGE_KEY = "mon-dashboard-tasks";

    let tasks = [];

    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      const parsed = saved ? JSON.parse(saved) : [];
      tasks = Array.isArray(parsed) ? parsed : [];
    } catch (error) {
      tasks = [];
    }

    const list = document.getElementById("tasks");
    const counter = document.getElementById("counter");
    const form = document.getElementById("taskForm");
    const input = document.getElementById("taskInput");

    function saveTasks() {
      try {
        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(tasks)
        );
      } catch (error) {
        alert("Impossible de sauvegarder les tâches.");
      }
    }

    function renderTasks() {
      list.replaceChildren();

      const completed = tasks.filter(t => t.done).length;
      counter.textContent =
        `${completed} tâche(s) terminée(s) sur ${tasks.length}`;

      tasks.forEach((task, index) => {
        const li = document.createElement("li");
        if (task.done) li.classList.add("done");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.done;
        checkbox.setAttribute(
          "aria-label", "Tâche terminée"
        );

        checkbox.addEventListener("change", () => {
          tasks[index].done = checkbox.checked;
          saveTasks();
          renderTasks();
        });

        const span = document.createElement("span");
        span.textContent = task.text;
        span.style.margin = "0 8px";

        const del = document.createElement("button");
        del.textContent = "Supprimer";

        del.addEventListener("click", () => {
          tasks.splice(index, 1);
          saveTasks();
          renderTasks();
        });

        li.append(checkbox, span, del);
        list.appendChild(li);
      });
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      tasks.push({ text, done: false });
      saveTasks();
      renderTasks();
      input.value = "";
      input.focus();
    });

    renderTasks();
  </script>
</body>
</html>
